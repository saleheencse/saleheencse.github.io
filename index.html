{w:1,n:"Intro to Algorithms & Data Structures",th:"An algorithm is a finite set of steps with at least one input and one output. A data structure organises data so operations are efficient. Structures are linear (array, linked list, stack, queue) or non-linear (tree, heap, hash table, graph). Python adds list, tuple, set and dict.",q:"Which of these is a linear data structure?",o:["Binary tree","Graph","Queue","Hash table"],a:2,e:"A queue stores items in sequence. Trees and graphs are non-linear."},
{w:2,n:"Fundamental Data Structures",h:"1e8d4b5f",th:"Arrays index from 0 with O(1) access. Linked lists chain nodes by pointers (singly, doubly, circular). A stack is LIFO (push/pop), and a queue is FIFO (enqueue/dequeue).",q:"Start with an empty stack. push('a'), push('b'), pop(), push('c'). What does peek() return?",o:["'a'","'b'","'c'","Stack is empty"],a:2,e:"After pop removes 'b', the stack is a, c, so the top is 'c'."},
{w:3,n:"Trees & Binary Trees",th:"A tree has a root, edges, parents, children and leaves. In a BST, left < node < right. AVL trees keep each balance factor in {-1, 0, +1} using rotations (LL, RR, LR, RL). B-Trees hold many keys per node to cut disk access.",q:"What does an in-order traversal of a BST produce?",o:["Keys in sorted order","Keys in insertion order","Keys level by level","Leaves only"],a:0,e:"In-order visits left, root, right, which gives ascending order in a BST."},
{w:5,n:"Advanced Data Structures",th:"Hashing maps a key to an index with a hash function; collisions are handled by e.g. chaining. A heap is a complete binary tree where each parent is >= (max-heap) or <= (min-heap) its children. A graph is vertices plus edges, stored as an adjacency matrix or list. BFS uses a queue, DFS a stack.",q:"In an array-based heap, where is the left child of the node at index i?",o:["i + 1","2i + 1","2i + 2","i / 2"],a:1,e:"Left child is 2i+1 and right child is 2i+2."},
{w:6,n:"Abstract Data Types",th:"An ADT defines what operations do, not how they are implemented. Stack, queue, list and tree ADTs can each be built on different underlying structures. Benefits: encapsulation, abstraction, information hiding, modularity.",q:"enqueue(1), enqueue(2), enqueue(3), dequeue(). What is at the front now?",o:["1","2","3","Empty"],a:1,e:"FIFO: dequeue removed 1, so 2 is now at the front."},
{w:7,n:"Sorting Algorithms",th:"Bubble sort swaps adjacent out-of-order pairs; insertion sort inserts each item into the sorted part; selection sort repeatedly picks the minimum. Merge sort and quick sort use divide and conquer for O(n log n) typical time.",q:"One bubble-sort pass (ascending) on [5, 3, 8, 1] gives:",o:["[1, 3, 5, 8]","[3, 5, 1, 8]","[3, 5, 8, 1]","[1, 5, 3, 8]"],a:1,e:"5,3 swap -> 3,5,8,1. 5,8 stay. 8,1 swap -> 3,5,1,8. The largest is now last."},
{w:8,n:"Searching & Hashing",th:"Linear search checks items one by one: O(n), works on unsorted data. Binary search halves a sorted range each step: O(log n). Hash tables give average O(1) lookup, using separate chaining to handle collisions.",q:"What does binary search require?",o:["A sorted collection","A linked list","A hash table","Unique values only"],a:0,e:"Halving the range only works if the data is sorted (and randomly accessible)."},
{w:9,n:"Algorithm Analysis & Big-O",th:"Big-O describes worst-case growth: O(1) < O(log n) < O(n) < O(n log n) < O(n^2) < O(2^n). Time complexity counts steps; space complexity counts memory. Two separate loops over N and M cost O(N + M).",q:"i = N; while i > 0: i //= 2. What is the time complexity?",o:["O(N)","O(sqrt N)","O(N/2)","O(log N)"],a:3,e:"i halves each iteration, so it takes about log2(N) steps."},
{w:10,n:"Algorithm Design Techniques",th:"Brute force tries everything. Greedy takes the best local choice (fast, not always optimal). Divide and conquer splits, solves and combines (merge sort). Dynamic programming stores overlapping subproblem results (Fibonacci, knapsack).",q:"Greedy coin change with [25, 10, 5, 1] for 67 cents uses how many coins?",o:["4","5","6","7"],a:2,e:"25+25+10+5+1+1 = 67, which is 6 coins."},
{w:11,n:"Recursion & Backtracking",th:"A recursive function calls itself on a smaller problem and needs a base case to stop. Recursion is concise but has call overhead. Backtracking builds a solution step by step and undoes (backtracks) choices that cannot lead to a solution, as in N-Queens and Sudoku.",q:"What is the purpose of a base case?",o:["Speed up the code","Stop the recursion","Store results","Sort the input"],a:1,e:"Without a base case the function calls itself forever."},
{w:12,n:"Applications: Red-Black Trees & Dijkstra",th:"Red-Black trees are self-balancing BSTs that guarantee O(log n) search, insert and delete. Dijkstra's algorithm finds shortest paths from a source in a graph with non-negative weights, using a min-priority queue. Choose structures by the problem: stack for undo, queue for scheduling, graph for maps.",q:"Which structure does Dijkstra's algorithm use to pick the next vertex?",o:["Stack","Min-priority queue","Hash table","Linked list"],a:1,e:"It repeatedly extracts the unvisited vertex with the smallest distance."}

var C={"1": {"t": "Real-Life Challenge: University IT Helpdesk", "p": ["A university IT helpdesk receives thousands of support tickets from students every semester.", "Each ticket contains:"], "l": ["Ticket ID", "Student ID", "Problem description", "Date submitted"], "p2": ["Before accepting a new ticket, the system must check whether the student has already submitted a ticket describing the same problem.", "For example:", "Ticket 101: Student 12345 – “Cannot access Moodle”", "Ticket 102: Student 67890 – “Wi-Fi not working”", "Ticket 103: Student 12345 – “Cannot access Moodle”", "Ticket 103 may be a duplicate of Ticket 101.", "The university wants to identify duplicates quickly without accidentally rejecting tickets from different students who have similar problems."], "q": ["Write a precise, step-by-step algorithm to check whether a new ticket is a duplicate.", "What information would you store for each ticket?", "How would you organise the tickets?", "Would you use a list, tuple, set or dictionary? Explain your choice.", "If the helpdesk has 100 tickets, how would you check for duplicates?", "Would your approach still be suitable if the helpdesk received 100,000 tickets?", "Can you think of a way to reduce the number of comparisons?"]}, "2": {"t": "Scenario: Web Browser – Back and Forward Navigation", "p": ["You are developing a web browser. A user visits the following pages:", "Google → YouTube → Wikipedia → Facebook → Amazon.", "The user then clicks Back three times, returning to YouTube. They now click a new link to visit Netflix.", "The browser must remember the navigation history correctly."], "q": ["How would you store the visited pages?", "What should happen when the user clicks Back?", "What should happen when the user clicks Forward?", "What happens to the previous Forward history when the user visits Netflix?", "How would you handle clicking Back when there are no more previous pages?"]}, "3": {"t": "Scenario: Online Gaming – Player Score Management", "p": ["An online gaming platform has 100,000 registered players. Their scores change frequently as they play.", "The platform needs to support three operations:"], "l": ["Check whether a particular score exists.", "Find the next higher score.", "Find the next lower score."], "p2": ["The system must respond quickly, even when new scores are frequently added."], "q": ["How would you store the scores if you wanted to search through them?", "Would keeping the scores sorted make searching easier?", "What happens when you need to insert a new score into a sorted list?", "Imagine scores arrive in increasing order: 10, 20, 30, 40, 50, and so on. Could this cause a problem for a tree-based solution?", "How could you prevent that problem?"]}, "5": {"t": "Scenario: Hospital Emergency Department – Patient Prioritisation", "p": ["A busy hospital emergency department receives patients throughout the day.", "Each patient is assigned a severity level from 1 to 5, where 5 represents the most critical condition.", "The hospital must always treat the most critical patient first. However, if two patients have the same severity level, the patient who arrived first must be treated first.", "New patients may arrive while others are waiting."], "q": ["How would you organise the waiting patients?", "How would you quickly identify the next patient to treat?", "What happens when a new patient arrives with a higher severity level?", "How would you ensure that two patients with the same severity level are treated in arrival order?", "Would your approach still work efficiently if there were thousands of waiting patients?"], "x": {"h": "Optional extension: Social Networking", "p": ["A social networking application wants to suggest friends to users.", "For example, if Alice is friends with Bob and Charlie, and Bob is friends with David, the application might suggest David to Alice.", "How would you represent these relationships and find possible friend suggestions?"]}}, "6": {"t": "Scenario: Music Streaming Application – Playlist Management", "p": ["You are developing a music playlist component for a music streaming application.", "Another developer is responsible for designing the application screens. They only need to know how to interact with your playlist component, not how it works internally.", "The playlist should support operations such as:"], "l": ["Add a song.", "Remove a song.", "Play the next song.", "Play the previous song.", "Get the current song.", "Find the number of songs.", "Check whether the playlist is empty."], "q": ["Design a list of operations that another developer can use.", "What information should each operation receive?", "What should each operation return?", "Should the other developer need to know whether you store the songs in an array or a linked list?", "Suppose you change the internal storage method later. Should the application screens need to be rewritten?"]}, "7": {"t": "Scenario: University Examination Office – Sorting Exam Papers", "p": ["A university has received 120 examination papers. Each paper has a unique student ID, and the papers must be arranged in ascending order of student ID.", "Four teaching assistants are available to help.", "The examination office wants to complete the task faster than one person sorting all 120 papers."], "q": ["How could you divide the papers among the four assistants?", "Can all four assistants sort their allocated papers independently?", "Once each assistant finishes, how would you combine the four sorted piles into one correctly sorted pile?", "The next day, another 10 late papers arrive. What would be the easiest way to insert these into the already sorted collection?", "Would you use the same approach if another 5,000 papers arrived?"]}, "8": {"t": "Scenario: University Student Registration – Finding Student Records", "p": ["A university has 100,000 student records. During enrolment, staff frequently need to check whether a particular student ID exists.", "The system must respond almost instantly because hundreds of students may be processed at the same time."], "q": ["#Part A – Searching", "Imagine the student IDs are stored in ascending order. How would you find a particular student ID?", "Would checking every student ID one by one be efficient?", "Can you find the student by repeatedly eliminating half of the remaining records?", "How many checks would you need in the worst case for 100,000 students?", "#Part B – Fast Lookup", "Now imagine the university wants to check whether any given student ID exists without searching through the entire collection. Could you prepare the data in advance to make checking an ID much faster?", "How would you organise the student IDs?", "What happens if two different student IDs are assigned to the same storage location?", "How would you handle that situation?"]}, "9": {"t": "Scenario: Duplicate Record Detection – Which Developer Did It Better?", "p": ["Two developers have written different programs to identify duplicate records in a university database.", "Both programs produce the correct result.", "Their performance tests show:"], "tb": [["Number of records", "Program A", "Program B"], ["1,000", "2 seconds", "0.01 seconds"]], "p2": ["The university is now planning to process 1,000,000 records."], "q": ["Estimate how long each program might take to process 1,000,000 records.", "Which program would you recommend?", "What assumptions are you making about how each program scales?", "Would you still recommend Program B if its performance became slower as the dataset increased?", "Why is measuring execution time on a small dataset sometimes misleading?"]}, "10": {"t": "Scenario: Postage System – Is Greedy Always the Best Choice?", "p": ["A country issues postage stamps worth 1, 3 and 4 cents.", "A postal clerk wants to use the smallest possible number of stamps to make a particular postage amount.", "The clerk follows a simple rule: always choose the largest stamp value that does not exceed the remaining postage."], "q": ["How would the clerk make 6 cents using this strategy?", "Can you find a better combination using fewer stamps?", "Does choosing the largest available stamp always produce the best result?", "How would you design a method that guarantees the minimum number of stamps for any postage amount?", "Would your solution still work if the country introduced new stamp values?"]}, "11": {"t": "Scenario: University Examination Timetabling – Avoiding Student Conflicts", "p": ["A university must schedule five examinations (A, B, C, D and E) across three available time slots.", "Some examinations share students and therefore cannot be scheduled at the same time.", "The following pairs have student conflicts:"], "l": ["A and B", "A and C", "B and C", "B and D", "C and E", "D and E"], "q": ["Can you schedule all five examinations using only two time slots?", "If not, explain why.", "Find a valid schedule using three time slots.", "Imagine you assign an examination to a time slot but later discover that another examination cannot be scheduled. What would you do?", "How could you systematically explore different possibilities without starting from scratch every time?"]}, "12": {"t": "Scenario: Delivery Company – Finding the Fastest Routes", "p": ["A delivery company operates from a central depot (A) and delivers packages to five customers (B, C, D, E and F).", "The roads connecting these locations have the following travel times:"], "tb": [["Road", "Travel time (minutes)"], ["A–B", "4"], ["A–C", "2"], ["B–C", "1"], ["B–D", "5"], ["C–E", "8"], ["D–E", "2"], ["D–F", "6"], ["E–F", "3"]], "p2": ["Assume all roads are two-way.", "The delivery company wants to find the fastest route from the depot to every customer."], "q": ["Draw a map showing all locations and roads, including the travel times.", "Find the fastest route from A to each of the five customers.", "What is the minimum travel time to reach customer F?", "Can you find more than one route that takes the same minimum time?", "Imagine the road between B and C is closed. How does this affect the fastest routes?", "Would finding the shortest route independently for every customer be the most efficient approach?"]}};

var SOL={"1": "### Option 1: Store tickets in a list\n\nExample:\n\n```python\ntickets = [\n    (101, 12345, \"Cannot access Moodle\"),\n    (102, 67890, \"Wi-Fi not working\"),\n    (103, 12345, \"Cannot access Moodle\")\n]\n```\n\nAlgorithm:\n\n1. Start.\n2. Read the new ticket's student ID and problem description.\n3. Set duplicate = False.\n4. Go through each existing ticket.\n5. Compare the student ID and problem description.\n6. If both match, set duplicate = True and stop searching.\n7. If duplicate is True, flag the ticket.\n8. Otherwise, accept and store the ticket.\n9. Stop.\n\n**Advantages**\n- Easy to understand.\n- Uses a Python list, which students already know.\n- Can store multiple tickets.\n\n**Limitations**\n- Every existing ticket may need to be checked.\n- The search becomes slower as the collection grows.\n\n### Option 2: Store tickets in a dictionary\n\nExample:\n\n```python\ntickets = {\n    (12345, \"Cannot access Moodle\"): 101,\n    (67890, \"Wi-Fi not working\"): 102\n}\n```\n\nAlgorithm:\n\n1. Start.\n2. Read the new ticket.\n3. Create a key from the student ID and problem description.\n4. Check whether the key exists in the dictionary.\n5. If it exists, flag the ticket as a duplicate.\n6. Otherwise, add the ticket to the dictionary.\n7. Stop.\n\n**Advantages**\n- Fast average-case lookup.\n- Avoids searching through every ticket.\n- A dictionary provides a natural way to associate a ticket key with its information.\n\n**Limitations**\n- Requires understanding how dictionary keys work.\n- The key must represent the definition of a duplicate correctly.\n- Identical descriptions from different students should not necessarily count as duplicates.\n\n### Option 3: Store ticket identifiers in a set\n\nExample:\n\n```python\nticket_keys = {\n    (12345, \"Cannot access Moodle\"),\n    (67890, \"Wi-Fi not working\")\n}\n```\n\nAlgorithm:\n\n1. Start.\n2. Read the new ticket.\n3. Create a key from the student ID and problem description.\n4. Check whether the key exists in the set.\n5. If it exists, flag the ticket.\n6. Otherwise, add the key to the set.\n7. Stop.\n\n**Advantages**\n- Efficient membership checking.\n- Automatically maintains unique keys.\n- Useful when the main requirement is checking whether something already exists.\n\n**Limitations**\n- A set does not directly associate a key with a ticket record.\n- Additional storage may be needed to maintain ticket details.\n\n### Recommended solution: Dictionary\n\nFor this particular scenario, I would recommend a dictionary.\n\nThe helpdesk needs to check whether a particular combination of student ID and problem description already exists.\n\nA dictionary allows the system to associate that combination with the corresponding ticket ID.\n\nThis demonstrates the practical importance of selecting an appropriate data structure.\n\nThe dictionary provides fast average-case lookup, while the list solution is easier to understand but may require checking every existing ticket.", "2": "### Option 1: Store all visited pages in an array\nExample:\n\n[Google, YouTube, Wikipedia, Facebook, Amazon]\n\nMaintain a current-page index.\n\n- Back: decrease the index.\n- Forward: increase the index.\n- New navigation: discard pages after the current index.\n\nAdvantages:\n- Simple implementation.\n- Direct access to history positions.\n\nLimitations:\n- Requires careful index management.\n- Inserting or removing elements may require shifting.\n- The Back/Forward logic becomes more complicated.\n\n### Option 2: Use a linked list\nEach page points to the previous and next page.\n\nAdvantages:\n- Navigation can follow links between pages.\n- Inserting or removing elements can be efficient when the relevant node is known.\n\nLimitations:\n- More complicated than necessary.\n- Must maintain links correctly.\n- Does not directly explain the LIFO behaviour of navigation history.\n\n### Option 3: Use two stacks\n\nMaintain:\n- Back stack\n- Forward stack\n- Current page\n\nWhen visiting a new page:\n1. Push the current page onto the Back stack.\n2. Set the new page as current.\n3. Clear the Forward stack.\n\nWhen clicking Back:\n1. Push the current page onto the Forward stack.\n2. Pop the Back stack and make that page current.\n\nWhen clicking Forward:\n1. Push the current page onto the Back stack.\n2. Pop the Forward stack and make that page current.\n\n### Best solution: Two stacks\n\n**Why?**\n\nThe browser's navigation behaviour naturally matches LIFO.\n\nThe most recently visited page is the first page to return to when going Back.\n\nThe Forward stack works similarly in reverse.\n\n### Teaching progression\n\nStudents already know arrays and linked lists.\n\nAsk:\n- Can we solve this using an array?\n- What makes the implementation complicated?\n- What if we only need to add and remove pages from one end?\n\nThen introduce stacks.\n\n**Optional extension:** Ask students to compare a stack-based solution with a queue. A queue would return the oldest item first, which is not the behaviour required for browser navigation.", "3": "### Option 1: Unsorted array or list\nStore all scores without sorting.\n\nTo find a score:\n- Start at the beginning.\n- Check every element until the score is found.\n\nComplexity:\n- Search: O(n)\n- Insert: O(1), if appending\n\nAdvantages:\n- Easy to implement.\n- Fast insertion.\n\nLimitations:\n- Searching is slow.\n- Finding the next higher or lower score requires examining the collection.\n\n### Option 2: Sorted array\nKeep scores sorted.\n\nAdvantages:\n- Binary search provides O(log n) search.\n- Finding neighbouring scores is straightforward.\n\nLimitations:\n- Inserting a score may require shifting many elements.\n- Frequent score updates make maintaining order expensive.\n\n### Option 3: Binary Search Tree\nStore scores according to the BST property:\n- Smaller values go left.\n- Larger values go right.\n\nAdvantages:\n- Search, insertion and deletion can be efficient.\n- Finding predecessor and successor is supported naturally.\n\nAverage complexity:\n- O(log n), when the tree is reasonably balanced.\n\nLimitations:\n- A poorly constructed tree can become unbalanced.\n\nFor example:\n\n10 → 20 → 30 → 40 → 50\n\nIf each new value is larger, the BST may behave like a linked list.\n\nWorst-case complexity:\n- Search: O(n)\n- Insert: O(n)\n\n### Option 4: AVL tree\nMaintain the BST property while balancing the tree after insertion and deletion.\n\nAdvantages:\n- Prevents severe imbalance.\n- Search, insertion and deletion remain O(log n).\n\n### Best solution: AVL tree\n\n**Why?**\n\nThe application frequently searches and updates scores. An AVL tree provides predictable logarithmic performance even when scores arrive in increasing or decreasing order.\n\n### Teaching progression\n\nStart with a sorted array and binary search.\n\nAsk:\n- Binary search is fast. What happens when we insert a new score?\n- What if we insert thousands of scores?\n- Could we maintain the sorted structure without shifting elements?\n\nIntroduce BSTs.\n\nThen demonstrate the increasing-score example and show why AVL balancing is necessary.\n\n### Where B-Trees fit\n\nFor large collections stored on disk, a B-Tree is often more appropriate.\n\nUnlike a binary tree, a B-Tree stores multiple keys in each node and reduces the number of disk accesses.\n\nThis is especially relevant to database indexes.", "5": "### Option 1: Unsorted list\nStore all waiting patients in a list.\n\nWhen a patient needs to be treated:\n- Examine every patient.\n- Find the highest severity.\n- If severity is tied, select the earliest arrival.\n\nComplexity:\n- Insert: O(1)\n- Find highest priority: O(n)\n\nAdvantages:\n- Very simple.\n- Suitable for small collections.\n\nLimitations:\n- Every selection requires scanning the list.\n\n### Option 2: Sorted list\nMaintain patients in priority order.\n\nAdvantages:\n- The next patient is immediately available.\n\nLimitations:\n- Inserting a new patient may require shifting elements.\n- Maintaining sorted order becomes expensive.\n\n### Option 3: Priority queue implemented using a heap\nStore patients in a heap ordered by severity.\n\nEach patient has:\n- Severity\n- Arrival sequence number\n\nUse the following priority:\n\n1. Higher severity first.\n2. Earlier arrival first when severity is equal.\n\nFor example:\n\n| Patient | Severity | Arrival |\n|---|---:|---:|\n| Alice | 5 | 1 |\n| Bob | 4 | 2 |\n| Charlie | 5 | 3 |\n\nAlice must be treated before Charlie because both have severity 5.\n\nA heap supports:\n- Insert: O(log n)\n- Remove highest priority: O(log n)\n- Peek at highest priority: O(1)\n\n### Best solution: Priority queue using a heap\n\n**Why?**\n\nPatients arrive continuously, and the hospital repeatedly needs the highest-priority patient.\n\nA heap avoids scanning or sorting the entire collection after each arrival.\n\n### Hash table extension\n\nFor retrieving patient records:\n- Use patient ID as the key.\n- Store the corresponding patient record in a hash table.\n\nAverage lookup complexity: O(1).\n\n### Graph extension\n\nFor social networking:\n- Represent each user as a vertex.\n- Represent friendships as edges.\n- Use adjacency lists to store each user's friends.\n\nThis is suitable because social relationships form a network rather than a simple sequence.", "6": "### Option 1: Directly expose an array\nThe application developer accesses the playlist array directly.\n\nExample:\n- Read element 3.\n- Remove element 5.\n- Insert a song at element 2.\n\nAdvantages:\n- Easy to understand initially.\n\nLimitations:\n- The application depends on the storage implementation.\n- Changing from an array to a linked list could break the application.\n- Internal details become exposed.\n\n### Option 2: Provide a playlist interface\nInstead of exposing the storage, provide operations:\n- addSong(song)\n- removeSong(song)\n- next()\n- previous()\n- current()\n- size()\n- isEmpty()\n\nThe application calls these operations without knowing how they are implemented.\n\n### Option 3: Change the implementation later\nInitially use an array.\n\nLater change the implementation to a linked list.\n\nAs long as the public operations behave the same way, the application developer does not need to change their code.\n\n### Best solution: Playlist ADT\n\n**Why?**\n\nAn ADT separates what the data structure does from how it is implemented.\n\nThe interface remains stable even when the implementation changes.\n\n### Teaching progression\n\nAsk:\n- Why should the UI developer know how songs are stored?\n- What if you change the implementation?\n- Could you provide the same operations regardless of the storage method?\n\nThis introduces abstraction and encapsulation.", "7": "### Option 1: One person sorts all papers\nUse a simple sorting method.\n\nAdvantages:\n- Straightforward.\n- No coordination required.\n\nLimitations:\n- Only one person works at a time.\n- May take longer for large collections.\n\n### Option 2: Four assistants sort separate piles\nDivide 120 papers into four groups of 30.\n\nEach assistant sorts their pile independently.\n\nThen combine the four sorted piles.\n\nThe important challenge is combining the sorted piles efficiently.\n\n### Option 3: Merge the sorted piles\nSuppose the assistants produce:\n\nPile 1: 10, 20, 30\nPile 2: 15, 25, 35\nPile 3: 12, 22, 32\nPile 4: 18, 28, 38\n\nCompare the smallest remaining element from each pile.\n\nRepeatedly select the smallest and add it to the final collection.\n\nThis is the merging process.\n\n### Best solution: Divide and conquer with merging\n\n**Why?**\n\nThe problem can be divided into smaller independent sorting tasks.\n\nEach group can work independently, and the results can be combined efficiently.\n\nThis is the central idea behind Merge Sort.\n\n### Late papers: Insertion sort\n\nSuppose the existing papers are sorted.\n\nOnly 10 new papers arrive.\n\nRather than sorting all 130 papers from scratch:\n\n1. Take a late paper.\n2. Find its correct position.\n3. Insert it.\n4. Repeat for the remaining papers.\n\nThis is similar to insertion sort.\n\nFor a small number of late papers, this can be more practical than re-sorting everything.\n\n### Teaching progression\n\nStart with the one-person approach.\n\nThen ask:\n- Can we divide the work?\n- How do we combine the results?\n- Does dividing the work automatically make the entire process faster?\n\nThis introduces divide and conquer.\n\nThen discuss the cost of merging and coordination.", "8": "### Option 1: Linear search\nStore student IDs in an unsorted list.\n\nCheck every ID until the student is found.\n\nComplexity: O(n).\n\nFor 100,000 students, the worst case requires 100,000 comparisons.\n\nAdvantages:\n- Simple.\n- No preparation required.\n\nLimitations:\n- Slow for repeated searches.\n\n### Option 2: Binary search\nSort the student IDs.\n\nRepeatedly examine the middle element and eliminate half the remaining search space.\n\nComplexity: O(log n).\n\nFor 100,000 records, binary search requires at most approximately 17 comparisons.\n\nAdvantages:\n- Much faster than linear search.\n- Requires no additional hash structure.\n\nLimitations:\n- Data must be sorted.\n- Inserting records into a sorted array can be expensive.\n\n### Option 3: Hash table\nUse a hash function to map student IDs to storage locations.\n\nFor example:\n\nStudent ID → Hash function → Storage location\n\nWhen searching:\n1. Apply the hash function.\n2. Check the corresponding location.\n3. Resolve a collision if necessary.\n\nAverage lookup complexity: O(1).\n\n### Best solution: Hash table\n\n**Why?**\n\nThe university performs repeated student ID lookups and needs fast access.\n\nHash tables provide average constant-time lookup without requiring the IDs to be sorted.\n\n### Teaching progression\n\nAsk:\n- Can we improve linear search?\n- What if we sort the records?\n- Can we avoid even the logarithmic search?\n- What if we prepare a structure specifically for looking up IDs?\n\nThis leads naturally from linear search to binary search and finally hashing.", "9": "### Option 1: Program A – Compare every pair\nSuppose Program A compares every record with every other record.\n\nIts complexity is O(n²).\n\nIf the input size increases by a factor of 1,000, the number of operations increases by approximately:\n\n1,000 × 1,000 = 1,000,000\n\nStarting with 2 seconds:\n\n2 × 1,000,000 = 2,000,000 seconds\n\nApproximately 23.1 days.\n\n### Option 2: Program B – Linear approach\nSuppose Program B processes each record once.\n\nIts complexity is O(n).\n\nIf the number of records increases by a factor of 1,000:\n\n0.01 × 1,000 = 10 seconds.\n\n### Best solution: Program B\n\n**Why?**\n\nThe input grows by a factor of 1,000, but the execution time grows by only a factor of 1,000 rather than 1,000,000.\n\nThis demonstrates why algorithmic complexity matters more than small improvements in execution time.\n\n### Teaching progression\n\nAsk:\n- Why is Program A acceptable for 1,000 records?\n- Why does it become impractical for 1,000,000?\n- What if we purchase a faster computer?\n- Will faster hardware solve a poor algorithm?\n\nThe key lesson is that improving growth rate is often more valuable than improving hardware.", "10": "### Option 1: Greedy algorithm\nAlways choose the largest available stamp that fits.\n\nFor 6 cents:\n- Choose 4 cents.\n- Remaining: 2 cents.\n- Choose 1 cent.\n- Remaining: 1 cent.\n- Choose another 1 cent.\n\nTotal: 3 stamps.\n\n### Option 2: Try different combinations\nFor 6 cents:\n- 4 + 1 + 1 = 6 → 3 stamps.\n- 3 + 3 = 6 → 2 stamps.\n- 1 + 1 + 1 + 1 + 1 + 1 = 6 → 6 stamps.\n\nThe greedy solution is not optimal.\n\n### Option 3: Dynamic programming\nDefine:\n\ndp[x] = minimum number of stamps required to make amount x.\n\nFor each amount:\n\ndp[x] = 1 + minimum(dp[x−1], dp[x−3], dp[x−4])\n\nOnly consider values that do not exceed x.\n\nFor 6 cents:\n- dp[0] = 0\n- dp[1] = 1\n- dp[2] = 2\n- dp[3] = 1\n- dp[4] = 1\n- dp[5] = 2\n- dp[6] = 2\n\nThe optimal solution is 3 + 3.\n\n### Best solution: Dynamic programming\n\n**Why?**\n\nThe greedy approach makes locally optimal decisions without considering the overall result.\n\nDynamic programming evaluates smaller subproblems and uses their optimal solutions to construct the overall optimal solution.\n\n### Teaching progression\n\nAsk:\n- Why does choosing the largest stamp seem reasonable?\n- Can you find a counterexample?\n- How can we guarantee the minimum number of stamps?\n- Could we reuse solutions to smaller amounts?\n\nThis introduces optimal substructure and overlapping subproblems.", "11": "### Option 1: Assign examinations sequentially\nPlace examinations into time slots one by one.\n\nFor example:\n- A → Slot 1\n- B → Slot 2\n- C → Slot 3\n- D → Slot 1\n- E → Slot 2\n\nThis produces a valid solution.\n\nAdvantages:\n- Easy to understand.\n- Works for small problems.\n\nLimitations:\n- A poor initial assignment may lead to a dead end.\n- There is no systematic way to recover from an invalid choice.\n\n### Option 2: Use two time slots\nTry assigning A, B and C.\n\nHowever:\n- A conflicts with B.\n- A conflicts with C.\n- B conflicts with C.\n\nThese three examinations form a triangle of conflicts.\n\nTherefore, they cannot all be scheduled using only two time slots.\n\n### Option 3: Backtracking\nAssign examinations one by one.\n\nFor each examination:\n1. Try a time slot.\n2. Check whether the assignment conflicts with previous examinations.\n3. If valid, continue.\n4. If no time slot works, undo the previous assignment.\n5. Try another possibility.\n\nThis explores the solution space systematically.\n\n### Best solution: Backtracking\n\n**Why?**\n\nThe problem involves constraints.\n\nBacktracking allows the algorithm to explore possible assignments and abandon choices that cannot lead to a valid solution.\n\n### Teaching progression\n\nAsk:\n- What happens if you make a wrong assignment?\n- Should you restart from the beginning?\n- Could you remember the previous choice?\n- Could you undo it and try another option?\n\nThis leads naturally to recursion and backtracking.\n\n### Graph interpretation\n\n- Exams are vertices.\n- Conflicts are edges.\n- Time slots are colours.\n\nThis is a graph-colouring problem.\n\nThe same technique is used in scheduling, Sudoku and other constraint-satisfaction problems.", "12": "### Option 1: Find routes manually\nTry different routes from A to each customer.\n\nFor example, to reach F:\n- A → B → D → F = 4 + 5 + 6 = 15\n- A → C → E → F = 2 + 8 + 3 = 13\n- A → C → B → D → F = 2 + 1 + 5 + 6 = 14\n\nAdvantages:\n- Easy for a small graph.\n- Students can reason visually.\n\nLimitations:\n- Becomes difficult as the number of locations increases.\n- Many possible paths must be examined.\n\n### Option 2: Breadth-first search\nUse BFS to explore neighbouring locations.\n\nAdvantages:\n- Finds shortest paths in terms of number of edges.\n\nLimitations:\n- Does not necessarily find the shortest travel time when roads have different weights.\n\nFor example, a route with two roads may take longer than a route with three roads.\n\n### Option 3: Dijkstra's algorithm\nStart from A.\n\nInitially:\n- Distance(A) = 0\n- All other distances = infinity.\n\nRepeatedly:\n1. Select the unvisited location with the smallest known distance.\n2. Update the distances to its neighbours.\n3. Mark the location as visited.\n4. Continue until all locations have been processed.\n\n### Best solution: Dijkstra's algorithm\n\n**Why?**\n\nThe graph has weighted roads, and all travel times are non-negative.\n\nDijkstra's algorithm finds the shortest path from a single starting point to every other reachable location.\n\nIt is more efficient than independently enumerating all possible routes.\n\n### Expected results\n\n| Customer | Shortest travel time | One shortest route |\n|---|---:|---|\n| B | 3 | A → C → B |\n| C | 2 | A → C |\n| D | 8 | A → C → B → D |\n| E | 10 | A → C → E |\n| F | 13 | A → C → E → F |\n\nThere are two shortest routes to F:\n- A → C → E → F = 13\n- A → C → B → D → E → F = 13\n\n### Road closure extension\n\nIf the road between B and C closes:\n\n| Customer | New shortest time | One shortest route |\n|---|---:|---|\n| B | 4 | A → B |\n| C | 2 | A → C |\n| D | 9 | A → B → D |\n| E | 10 | A → C → E |\n| F | 13 | A → C → E → F |\n\nThe closure changes the best route to B and D, but not the shortest travel time to E or F.\n\n### Teaching progression\n\nAsk:\n- How would you solve this manually?\n- What happens when the graph has 10,000 locations?\n- Is the shortest route always the route with the fewest roads?\n- Can we reuse the shortest distances already calculated?\n\nThis motivates weighted graphs and Dijkstra's algorithm."};

/* ---- Week 5 (BFS/DFS) and Week 12 (Dijkstra); undirected or directed ---- */
var G=[[0,1,4],[0,2,2],[1,2,1],[1,3,5],[2,4,8],[3,4,2],[3,5,6],[4,5,3]],gs={},NM="ABCDEF";
function nb(u){var r=[];G.forEach(function(e){if(e[0]==u)r.push([e[1],e[2]]);if(!gs.dir&&e[1]==u)r.push([e[0],e[2]])});return r.sort(function(a,b){return a[0]-b[0]})}
function gOrd(s,ty){var o=[],q=[s],sn={};sn[s]=1;

 else{(function d(u){sn[u]=1;o.push(u);nb(u).forEach(function(x){if(!sn[x[0]])d(x[0])})})(s)}

 if(!dj)["BFS","DFS"].forEach(function(a){h+='<button class="'+(g.ty==a?"on":"")+'" onclick="gNew(\'tr\',\''+a+'\')">'+a+'</button>'});
 [false,true].forEach(function(d){h+='<button class="'+(g.dir==d?"on":"")+'" onclick="gNew(gs.k,gs.ty,'+d+')">'+(d?"Directed":"Undirected")+'</button>'});
 h+='</div>'+(dj?'<p>Dijkstra from <b>A</b>. Tap the unvisited vertex with the smallest tentative distance to finalise next.</p>':'<p>Start at <b>'+NM[g.s]+'</b>. Tap the vertices in '+g.ty+' order. When there is a choice, take the alphabetically first.</p>');
 h+='<svg viewBox="0 0 300 300" width="320"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L8,4L0,8z" fill="var(--mu)"/></marker></defs>';
 G.forEach(function(e){var a=gp(e[0]),b=gp(e[1]),dx=b[0]-a[0],dy=b[1]-a[1],L=Math.sqrt(dx*dx+dy*dy),x2=g.dir?b[0]-dx/L*24:b[0],y2=g.dir?b[1]-dy/L*24:b[1];
  h+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--mu)"'+(g.dir?' marker-end="url(#ar)"':'')+'/>';
  if(dj)h+='<text x="'+(a[0]+b[0])/2+'" y="'+(a[1]+b[1])/2+'" fill="var(--ac)" font-size="13" text-anchor="middle">'+e[2]+'</text>'});
 for(var i=0;i<6;i++){var p=gp(i);h+=svgN(p[0],p[1],NM[i],g.vis.indexOf(i)>=0?"sel":"","gTap("+i+")")}
 h+='</svg>';if(dj)h+='<p class="mu">'+g.d.map(function(x,i){return NM[i]+"="+(x==Infinity?"inf":x)}).join("&nbsp; ")+'</p>';
 $("vz").innerHTML=h+'<p>Sequence: <b>'+(g.vis.map(function(i){return NM[i]}).join(" &rarr; ")||"-")+'</b></p><p id="mm">'+g.m+'</p><button onclick="gNew(gs.k,gs.ty)">Restart</button>'}
function gTap(i){var g=gs;
 if(g.k=="tr"){if(g.vis.length>=g.o.length)return;
  if(i==g.o[g.vis.length]){g.vis.push(i);if(g.vis.length==g.o.length){rec(true);g.m='<span class="ok">All vertices visited in '+g.ty+' order!</span>'}else g.m="Correct. Next vertex?"}
  else{rec(false);g.m='<span class="bad">Not next.</span> '+(g.ty=="BFS"?"BFS visits all neighbours of the earliest-visited vertex first (a queue).":"DFS goes as deep as possible before backing up (a stack).")}}
 else{if(g.fin[i])return;var m=Infinity;g.d.forEach(function(x,j){if(!g.fin[j]&&x<m)m=x});
  if(g.d[i]==m){g.fin[i]=1;g.vis.push(i);nb(i).forEach(function(x){if(g.d[i]+x[1]<g.d[x[0]])g.d[x[0]]=g.d[i]+x[1]});
   if(g.vis.length==6){rec(true);g.m='<span class="ok">All shortest distances found!</span>'}else g.m=NM[i]+" finalised; neighbour distances updated. Next?"}
  else{rec(false);g.m='<span class="bad">Not the smallest.</span> Pick the unvisited vertex with the smallest tentative distance.'}}
 gDraw()}

var gr={mode:"coin"};
function cNew(){gr={mode:gr.mode,r:31+Math.floor(Math.random()*69),p:[],f:[0,1],m:""};cDraw()}
function cDraw(){var h='<div class="row tabs"><button class="'+(gr.mode=="coin"?"on":"")+'" onclick="gr.mode=\'coin\';cNew()">Greedy: coin change</button><button class="'+(gr.mode=="fib"?"on":"")+'" onclick="gr.mode=\'fib\';cNew()">DP: Fibonacci table</button></div>';

  [25,10,5,1].forEach(function(c){h+='<button onclick="cPick('+c+')">'+c+'c</button>'});h+='</div>'}

/* ---- Week 11: 4-Queens backtracking ---- */
var nq={};
function nNew(){nq={q:[],t:[[],[],[],[]],m:"Place a queen in column 1: tap a cell."};nDraw()}
function nSafe(r,c){for(var i=0;i<c;i++){if(nq.q[i]==r||Math.abs(nq.q[i]-r)==c-i)return 0}return nq.t[c].indexOf(r)<0}
function nFree(c){for(var r=0;r<4;r++)if(nSafe(r,c))return 1;return 0}
function nDraw(){var h='<p>Place one queen per column so none attack each other (row or diagonal). If a column has no safe cell, press Backtrack.</p><div style="display:grid;grid-template-columns:repeat(4,56px);gap:3px">';
 for(var r=0;r<4;r++)for(var c=0;c<4;c++)h+='<button onclick="nTap('+r+','+c+')" style="height:56px;font-size:1.4rem;padding:0;'+(c==nq.q.length?'border-color:var(--ac)':'')+'">'+(nq.q[c]===r?"&#9819;":(nq.t[c].indexOf(r)>=0?'<span class="mu">x</span>':""))+'</button>';
 $("vz").innerHTML=h+'</div><p id="mm">'+nq.m+'</p><button onclick="nBack()">Backtrack</button> <button onclick="nNew()">Restart</button>'}
function nTap(r,c){var k=nq.q.length;if(k>3)return;
 if(c!=k)nq.m="Work on column "+(k+1)+" (highlighted).";
 else if(nSafe(r,c)){nq.q.push(r);if(nq.q.length==4){rec(true);nq.m='<span class="ok">Solved! All 4 queens are safe.</span>'}else nq.m="Placed. Next column."}
 else{rec(false);nq.m='<span class="bad">Not allowed:</span> that cell is attacked by an earlier queen (or already tried).'}nDraw()}
function nBack(){var k=nq.q.length;if(k>3||!k)return;
 if(nFree(k))nq.m="This column still has a safe cell, so don't backtrack yet.";
 else{var r=nq.q.pop();nq.t[k-1].push(r);nq.t[k]=[];nq.m="Backtracked: the queen in column "+k+" cannot lead to a solution. Try another cell there (x = already tried)."}nDraw()}
